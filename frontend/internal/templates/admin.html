{{ define "content" }}
<div class="uk-container uk-container-xl py-8">
    <h1 class="text-3xl font-bold mb-8 text-foreground">Admin Dashboard</h1>

    <div class="uk-card uk-card-default overflow-hidden">
        <div class="uk-card-header">
            <h2 class="uk-card-title">Tracked Entities</h2>
        </div>
        <div class="uk-overflow-auto">
            <table class="uk-table uk-table-divider uk-table-hover uk-table-middle">
                <thead>
                    <tr>
                        <th class="uk-table-expand">Title</th>
                        <th class="w-32">Type</th>
                        <th class="w-32">Status</th>
                        <th class="w-24">Monitored</th>
                        <th class="w-48">Requested By</th>
                        <th class="w-32 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {{ range .Entities }}
                    <tr id="entity-{{ .UUID }}">
                        <td>
                            <div class="font-medium text-foreground">
                                {{ .UUID }}
                            </div>
                        </td>
                        <td>
                            <span class="uk-badge bg-primary text-primary-foreground">
                                {{ .EntityType }}
                            </span>
                        </td>
                        <td>
                            <span class="uk-badge 
                                {{ if eq .Status "AVAILABLE" }}bg-green-600 text-white
                                {{ else if eq .Status "WANTED" }}bg-yellow-600 text-white
                                {{ else if eq .Status "DOWNLOADED" }}bg-blue-600 text-white
                                {{ else }}bg-muted text-muted-foreground{{ end }}">
                                {{ .Status }}
                            </span>
                        </td>
                        <td class="text-muted-foreground">
                            {{ if .Monitored }}
                            <uk-icon icon="check" class="text-green-500"></uk-icon>
                            {{ else }}
                            <uk-icon icon="x" class="text-destructive"></uk-icon>
                            {{ end }}
                        </td>
                        <td class="text-muted-foreground">
                            {{ if .RequestedBy }}{{ .RequestedBy }}{{ else }}-{{ end }}
                        </td>
                        <td class="text-right">
                            <button hx-delete="/admin/entity/{{ $.ActiveBackendID }}/{{ .UUID }}" 
                                    hx-confirm="Are you sure you want to delete this entity?"
                                    hx-target="#entity-{{ .UUID }}"
                                    hx-swap="outerHTML"
                                    class="uk-btn uk-btn-destructive uk-btn-sm uk-btn-icon">
                                <uk-icon icon="trash-2"></uk-icon>
                            </button>
                        </td>
                    </tr>
                    {{ end }}
                </tbody>
            </table>
        </div>
    </div>
</div>
{{ end }}
