{{ define "content" }}
<div class="space-y-6">
    <!-- Header -->
    <!-- Search Bar -->
    <div class="w-full">
        <form action="/view/{{ .ActiveBackendID }}/search" method="GET">
            <div class="uk-inline w-full">
                <span class="uk-form-icon">
                    <uk-icon icon="search"></uk-icon>
                </span>
                <input type="text"
                       name="query"
                       class="uk-input uk-form-lg w-full"
                       placeholder="Search for {{ .ActiveBackendName }}...">
            </div>
        </form>
    </div>

    <!-- Curated Lists -->
    {{ if .Lists }}
    <div class="mt-12 space-y-12">
        {{ range .Lists }}
        <div>
            <h3 class="text-xl font-bold text-foreground mb-4">{{ .Title }}</h3>
            <div class="flex overflow-x-auto space-x-6 p-4 scrollbar-hide">
                {{ range .Children }}
                <div class="flex-none w-48 uk-card uk-card-default overflow-hidden cursor-pointer group relative transform transition-transform duration-200 hover:scale-105 hover:z-10"
                     hx-get="/view/{{ $.ActiveBackendID }}/details?id={{ .ID }}&type={{ .Type }}"
                     hx-target="#modal-container"
                     hx-swap="innerHTML"
                     hx-trigger="click">
                    <div class="relative w-full" style="aspect-ratio: 2/3;">
                        {{ if .Image }}
                        <img src="{{ .Image }}" alt="{{ .Title }}" class="object-cover w-full h-full">
                        {{ else }}
                        <div class="w-full h-full bg-muted flex items-center justify-center">
                            <uk-icon icon="image" width="40" height="40" class="text-muted-foreground"></uk-icon>
                        </div>
                        {{ end }}
                    </div>
                </div>
                {{ end }}
            </div>
        </div>
        {{ end }}
    </div>
    {{ end }}

</div>
{{ end }}
