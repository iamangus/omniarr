{{ range .Results }}
<div class="group relative bg-gray-800 rounded-lg overflow-hidden shadow-lg cursor-pointer transform transition-transform duration-200 hover:scale-105 hover:z-10"
     hx-get="/view/{{ $.BackendID }}/details?id={{ .ID }}&type={{ .Type }}"
     hx-target="#modal-container"
     hx-swap="innerHTML"
     hx-trigger="click">
    <div class="aspect-w-2 aspect-h-3 bg-gray-700">
        {{ if .Image }}
        <img src="{{ .Image }}" alt="{{ .Title }}" class="object-cover w-full h-full">
        {{ else }}
        <div class="flex items-center justify-center h-full text-gray-500">
            <i class="fas fa-image fa-3x"></i>
        </div>
        {{ end }}
    </div>
</div>
{{ else }}
<div class="col-span-full text-center text-gray-400 py-12">
    <p>No results found.</p>
</div>
{{ end }}
