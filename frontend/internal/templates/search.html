{{ define "content" }}
<div class="space-y-6">
    <!-- Header -->
    <div class="md:flex md:items-center md:justify-between">
        <div class="flex-1 min-w-0">
            <h2 class="text-2xl font-bold leading-7 text-foreground sm:text-3xl sm:truncate">
                Search Results for "{{ .Query }}"
            </h2>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="w-full">
        <form action="/view/{{ .ActiveBackendID }}/search" method="GET" class="w-full">
            <div class="uk-inline w-full">
                <span class="uk-form-icon">
                    <uk-icon icon="search"></uk-icon>
                </span>
                <input type="text" 
                       name="query" 
                       value="{{ .Query }}"
                       class="uk-input uk-form-lg w-full"
                       placeholder="Search for {{ .ActiveBackendName }}...">
            </div>
        </form>
    </div>

    <!-- Search Results -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 mt-8">
        {{ range .Results }}
        <div class="uk-card uk-card-default overflow-hidden cursor-pointer group relative transform transition-transform duration-200 hover:scale-105 hover:z-10"
             hx-get="/view/{{ $.ActiveBackendID }}/details?id={{ .ID }}&type={{ .Type }}"
             hx-target="#modal-container"
             hx-swap="innerHTML"
             hx-trigger="click">
            <div class="aspect-w-2 aspect-h-3 bg-muted">
                {{ if .Image }}
                <img src="{{ .Image }}" alt="{{ .Title }}" class="object-cover w-full h-full">
                {{ else }}
                <div class="flex items-center justify-center h-full text-muted-foreground">
                    <uk-icon icon="image" width="48" height="48"></uk-icon>
                </div>
                {{ end }}
            </div>
        </div>
        {{ else }}
        <div class="col-span-full text-center text-muted-foreground py-12">
            <p>No results found.</p>
        </div>
        {{ end }}
    </div>
</div>
{{ end }}
